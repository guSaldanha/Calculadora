<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital@0;1&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculadora" aria-label="Calculadora">

    <div class="visor" aria-live="polite">
      <div class="expressao" id="expressao"></div>
      <div class="resultado" id="resultado">0</div>
    </div>

    <div class="teclas" id="teclas">
      <button class="tecla func" data-acao="limpar" aria-label="Limpar tudo">C</button>
      <button class="tecla func" data-acao="apagar" aria-label="Apagar último dígito">⌫</button>
      <button class="tecla func" data-acao="porcento" aria-label="Porcentagem">%</button>
      <button class="tecla op" data-op="/" aria-label="Dividir">÷</button>

      <button class="tecla" data-num="7">7</button>
      <button class="tecla" data-num="8">8</button>
      <button class="tecla" data-num="9">9</button>
      <button class="tecla op" data-op="*" aria-label="Multiplicar">×</button>

      <button class="tecla" data-num="4">4</button>
      <button class="tecla" data-num="5">5</button>
      <button class="tecla" data-num="6">6</button>
      <button class="tecla op" data-op="-" aria-label="Subtrair">−</button>

      <button class="tecla" data-num="1">1</button>
      <button class="tecla" data-num="2">2</button>
      <button class="tecla" data-num="3">3</button>
      <button class="tecla op" data-op="+" aria-label="Somar">+</button>

      <button class="tecla larga" data-num="0">0</button>
      <button class="tecla" data-acao="decimal" aria-label="Vírgula">,</button>
      <button class="tecla igual" data-acao="igual" aria-label="Igual">=</button>

      <button class="tecla func larga" data-acao="inverter" aria-label="Inverter sinal">±</button>
      <button class="tecla op larga" data-op="^" aria-label="Potência">xʸ</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
